name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please check that it hasn't already been reported.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: When I drag a task to Review, it jumps back to In Progress.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /tasks
        2. Drag a task from In Progress to Review
        3. ...
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Signed in as
      options:
        - Admin
        - Project Manager
        - Employee
        - Not signed in
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on macOS
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Optional, but very helpful.
